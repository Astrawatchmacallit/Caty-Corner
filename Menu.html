<DOCTYPE html>
    <html>
<head>
    <title> Catty Corner </title>
    <link rel="stylesheet" href="Website.css">
</head>
   
<body>
    <!--Header-->
    <div id="Header">
        <div class="brand-header">
            <img src="logo.png" width="100" length="100">
            <h1>⋆˚꩜｡⋆Catty-Corner⋆˚꩜｡⋆</h1>
        </div>
        
       <div class="navbar">
         <a href="Main1.html">HOME</a>
         <a href="Menu.html">MENU</a>
         <a href="Cats.html">KITTENS</a>
         <a href="Contact.html">CONTACT</a>
         <a href="Reservation.html">RESERVATION</a>
       </div>

    </div>

    <!--MAIN-->
    <DIV ID="MAIN">

        <DIV CLASS="photo-gallery">
            <img src="photos/mix.jpg" alt="mix">
            <img src="photos/dessert1.jpg" alt="dessert">
            <img src="photos/dessert2.jpg" alt="dessert">
            <img src="photos/dessert3.jpg" alt="dessert">
            <img src="photos/breakfast1.jpg" alt="breakfast">
            <img src="photos/cold1.jpg" alt="cold">
            <img src="photos/cold2.jpg" alt="cold">
            <img src="photos/hot1.jpg" alt="hot">
            <img src="photos/Burger-Cat-scaled.png" alt="mix">
        </DIV>

        <dialog class="photo-viewer" aria-label="Photo viewer">
            <button class="photo-viewer-close" type="button" aria-label="Close photo viewer">&times;</button>
            <div class="photo-viewer-image-container">
                <img class="photo-viewer-image" alt="">
            </div>
            <div class="photo-viewer-controls" aria-label="Photo zoom controls">
                <button type="button" data-zoom="out" aria-label="Zoom out">-</button>
                <button type="button" data-zoom="reset">Reset</button>
                <button type="button" data-zoom="in" aria-label="Zoom in">+</button>
            </div>
            <p class="photo-viewer-help">Use the buttons or mouse wheel to zoom. Press Escape to close.</p>
        </dialog>
    </DIV>

    <!--FOOTER-->
    <DIV ID="FOOTER">
        <P>&COPY;Catty Corner</P>
        <p>+63 912 345 6789</p>
        <a href="https://www.facebook.com">Catty Corner Official Facebook Page</a>
    </DIV>


    <script>
        const photoViewer = document.querySelector(".photo-viewer");
        const viewerImage = photoViewer.querySelector(".photo-viewer-image");
        let zoomLevel = 1;

        function setZoom(level) {
            zoomLevel = Math.min(3, Math.max(0.5, level));
            viewerImage.style.transform = `scale(${zoomLevel})`;
        }

        document.querySelectorAll(".photo-gallery img").forEach((photo) => {
            photo.tabIndex = 0;
            photo.setAttribute("role", "button");
            photo.setAttribute("aria-label", `Open ${photo.alt}`);

            function openPhoto() {
                viewerImage.src = photo.src;
                viewerImage.alt = photo.alt;
                setZoom(1);
                photoViewer.showModal();
            }

            photo.addEventListener("click", openPhoto);
            photo.addEventListener("keydown", (event) => {
                if (event.key === "Enter" || event.key === " ") {
                    event.preventDefault();
                    openPhoto();
                }
            });
        });

        photoViewer.querySelector(".photo-viewer-close").addEventListener("click", () => {
            photoViewer.close();
        });

        photoViewer.querySelectorAll("[data-zoom]").forEach((button) => {
            button.addEventListener("click", () => {
                const action = button.dataset.zoom;
                setZoom(action === "in" ? zoomLevel + 0.25 : action === "out" ? zoomLevel - 0.25 : 1);
            });
        });

        photoViewer.querySelector(".photo-viewer-image-container").addEventListener("wheel", (event) => {
            event.preventDefault();
            setZoom(zoomLevel + (event.deltaY < 0 ? 0.1 : -0.1));
        }, { passive: false });

        photoViewer.addEventListener("click", (event) => {
            if (event.target === photoViewer) {
                photoViewer.close();
            }
        });
    </script>
</body>



 </html>
</DOCTYPE>
